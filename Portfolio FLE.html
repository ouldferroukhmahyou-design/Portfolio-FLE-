<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio FLE</title>
<style>
:root{--bg:#fff;--card:#fff;--tx:#3c3c3c;--mu:#777;--bd:#e5e5e5;--g:#58cc02;--gd:#46a302;--in:#f7f7f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#131f24;--card:#1f2c33;--tx:#f1f7fb;--mu:#a5b3bb;--bd:#37464f;--in:#16242b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#131f24;--card:#1f2c33;--tx:#f1f7fb;--mu:#a5b3bb;--bd:#37464f;--in:#16242b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Nunito","Trebuchet MS",system-ui,sans-serif;font-weight:700}
#app{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:26px;margin:0;font-weight:900;color:var(--g)}h2{font-size:20px;margin:22px 0 10px;font-weight:900}
p{margin:2px 0;color:var(--mu)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sm{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:8px 12px;box-shadow:0 3px 0 var(--bd);font-weight:800}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:14px;margin:12px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--card);border:2px solid var(--bd);border-radius:16px;text-align:center;padding:10px 4px;font-weight:900;font-size:18px}
.stat small{display:block;color:var(--mu);font-size:12px;font-weight:700}
.btn{display:block;width:100%;background:var(--g);color:#fff;border-radius:16px;padding:13px;font-weight:900;font-size:16px;box-shadow:0 4px 0 var(--gd);margin-top:10px}
.btn:active,.sm:active{transform:translateY(3px);box-shadow:none}
.btn.red{background:#ff4b4b;box-shadow:0 4px 0 #cc3b3b}
.bar{display:block;height:12px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:6px}
.bar u{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .4s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.th{color:#fff;text-align:left;border-radius:20px;padding:14px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 5px 0 rgba(0,0,0,.22);font-weight:900;font-size:16px}
.th:active{transform:translateY(4px);box-shadow:none}
.th .em{font-size:44px;line-height:1}.th .bar{background:rgba(255,255,255,.35)}.th .bar u{background:#fff}.th small{font-weight:800;opacity:.95}
.ban{color:#fff;border-radius:22px;padding:18px;text-align:center;margin:12px 0}.ban .em{font-size:54px}.ban b{display:block;font-size:22px;font-weight:900}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:8px 2px;font-size:13px;font-weight:800}
.tab.on{border-color:var(--g);background:rgba(88,204,2,.14);color:var(--g)}
.ob{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:12px;margin:8px 0;box-shadow:0 3px 0 var(--bd)}
.ob i{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--bd);display:grid;place-items:center;font-style:normal;color:#fff}
.ob.ok{border-color:var(--g)}.ob.ok i{background:var(--g);border-color:var(--g)}
textarea,input,select{width:100%;background:var(--in);border:2px solid var(--bd);border-radius:14px;padding:11px;margin-top:6px}
textarea{min-height:90px;resize:vertical}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pg img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;border:2px solid var(--bd);display:block}
.pg span{font-size:13px;color:var(--mu)}
.x{float:right;background:none;color:var(--mu);font-size:18px}
audio{width:100%;margin-top:6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
.ov img{max-width:100%;max-height:70%;border-radius:14px}.ov .btn{max-width:260px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#131f24;color:#fff;border-radius:16px;padding:10px 18px;z-index:10;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:90%}
#toast.on{opacity:1}
.rec{animation:p 1s infinite}@keyframes p{50%{opacity:.6}}@media(prefers-reduced-motion:reduce){.rec{animation:none}}
:focus-visible{outline:3px solid #1cb0f6;outline-offset:2px}
.page{position:relative;background:#fffdf5;border:2px solid #e3dccb;border-radius:6px 16px 16px 6px;box-shadow:0 4px 0 #d8cfb8;margin-top:8px;overflow:hidden;color:#1f2d4d}
.page::before{content:"";position:absolute;top:0;bottom:0;left:46px;width:2px;background:#e57373}
.page::after{content:"";position:absolute;top:0;bottom:0;left:10px;width:16px;background:radial-gradient(circle,#d9d2bf 5px,transparent 6px) 0 12px/16px 56px repeat-y}
.pgh{display:flex;justify-content:space-between;padding:10px 14px 6px 58px;font-weight:900;font-size:14px;color:#2b4a8c;border-bottom:2px solid #bcd3ee;position:relative;z-index:1}
.page textarea{display:block;position:relative;z-index:1;background:linear-gradient(transparent 27px,#bcd3ee 27px 28px) 0 0/100% 28px local;background-color:transparent;border:0;border-radius:0;margin:0;min-height:252px;line-height:28px;padding:0 14px 0 58px;color:#1f2d4d;font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive}
.sheet{background:#fffdf5;border-color:#e3dccb;border-left:5px solid #e57373;color:#1f2d4d;font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive}
.sheet span,.sheet .x{color:#6b7a99!important}.sheet>span:first-of-type{color:#1f2d4d!important}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const T=[
{id:'id',n:'Identité',e:'🪪',c:'#1cb0f6',o:['Je me présente : « Je m’appelle… »','Je donne mon âge et ma nationalité','Je dis mon adresse et mon numéro de téléphone','J’épelle mon nom et mon prénom']},
{id:'ad',n:'Démarches administratives',e:'🏛️',c:'#ce82ff',o:['Je comprends un document de la préfecture','Je remplis un formulaire simple','Je prends un rendez-vous par téléphone','Je demande de l’aide à un guichet']},
{id:'sa',n:'Santé',e:'🏥',c:'#ff4b4b',o:['Je dis où j’ai mal : « J’ai mal à… »','Je prends rendez-vous chez le médecin','Je comprends une ordonnance','Je vais à la pharmacie']},
{id:'tr',n:'Transport',e:'🚌',c:'#ff9600',o:['J’achète un ticket ou un abonnement','Je demande mon chemin','Je lis un plan de métro ou de bus','Je comprends les horaires']},
{id:'lo',n:'Logement',e:'🏠',c:'#58a700',o:['Je décris mon logement','Je comprends mon contrat de location','Je signale un problème à mon propriétaire','Je connais les pièces et les meubles']},
{id:'tv',n:'Travail et emploi',e:'💼',c:'#2b70c9',o:['Je dis mon métier et mon expérience','Je comprends une offre d’emploi','Je me présente à un entretien','Je parle avec France Travail']},
{id:'ec',n:'École et enfants',e:'🎒',c:'#ff86d0',o:['J’inscris mon enfant à l’école','Je parle avec l’enseignant','Je comprends un mot dans le cahier','Je connais les horaires de l’école']},
{id:'co',n:'Commerces et achats',e:'🛒',c:'#e5a400',o:['Je demande un prix','Je fais mes courses','Je paie et je demande un ticket','Je lis une étiquette']},
{id:'ba',n:'Banque et argent',e:'🏦',c:'#00a67e',o:['J’ouvre un compte','Je comprends un relevé bancaire','Je fais un virement','Je dis « carte bancaire » et « code »']},
{id:'vi',n:'Vie quotidienne et loisirs',e:'🎉',c:'#8549ba',o:['Je parle de ma journée','J’invite quelqu’un','Je parle de mes loisirs','Je connais les fêtes en France']}];
let S={name:'',xp:0,days:[],done:{},notes:[],photos:[],voices:[],today:null},db,cur=null,tab='no',view=null,rec=null,busy=false;
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),td=()=>new Date().toISOString().slice(0,10),fd=d=>new Date(d).toLocaleDateString('fr-FR');
const op=()=>new Promise(r=>{try{const q=indexedDB.open('pfle',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const ld=()=>new Promise(r=>{if(!db)return r();try{const g=db.transaction('k').objectStore('k').get('s');g.onsuccess=()=>{if(g.result)S=Object.assign(S,g.result);r()};g.onerror=()=>r()}catch(e){r()}});
const sv=()=>{try{db&&db.transaction('k','readwrite').objectStore('k').put(S,'s')}catch(e){}};
const inapp=()=>/FBAN|FBAV|Instagram|WhatsApp|; wv\)|Line\//i.test(navigator.userAgent);
const warn=()=>(inapp()||!db)?`<div class=card style="border-color:#ff9600"><b>⚠️ Ouvre dans Chrome ou Safari</b><p>Dans WhatsApp, les photos et les vocaux ne s’enregistrent pas. Touche ⋮ (ou l’icône boussole) puis « Ouvrir dans le navigateur ».</p><button class=btn data-a=copy>📋 Copier le lien</button></div>`:'';
const rd=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
function toast(m){const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2200)}
function gain(n){S.xp+=n;if(!S.days.includes(td()))S.days.push(td());if(!S.today||S.today.d!==td())S.today={d:td(),xp:0};S.today.xp+=n;sv();toast('+'+n+' XP ⚡ Bravo !')}
function streak(){let n=0,d=new Date();const f=x=>x.toISOString().slice(0,10);if(!S.days.includes(f(d)))d.setDate(d.getDate()-1);while(S.days.includes(f(d))){n++;d.setDate(d.getDate()-1)}return n}
const pct=t=>Math.min(100,(S.notes.filter(x=>x.t===t.id).length+S.photos.filter(x=>x.t===t.id).length+S.voices.filter(x=>x.t===t.id).length)*20);
function home(){const g=S.today&&S.today.d===td()?S.today.xp:0,gp=Math.min(100,g*5);
return `<div class=top><div><h1>Portfolio FLE</h1><p>${S.name?'Bonjour '+E(S.name)+' 👋':'Bienvenue 👋'}</p></div><button class=sm data-a=share>🔗 Partager</button></div>
${warn()}${S.name?'':'<div class=card><b>Comment tu t’appelles ?</b><input id=nm placeholder="Ton prénom" maxlength=30><button class=btn data-a=name>C’est parti !</button></div>'}
<div class=stats><div class=stat>🔥 ${streak()}<small>jours de suite</small></div><div class=stat>⚡ ${S.xp}<small>points XP</small></div><div class=stat>🏆 ${Math.floor(S.xp/100)+1}<small>niveau</small></div></div>
<div class=card><b>Objectif du jour : 20 XP</b> <span style="float:right">${g}/20</span><span class=bar><u style="width:${gp}%"></u></span></div>
<h2>Mes thèmes</h2><div class=grid>${T.map(t=>`<button class=th data-a=open data-id=${t.id} style="background:linear-gradient(135deg,${t.c},${t.c}bb)"><span class=em>${t.e}</span><span>${t.n}</span><span><span class=bar><u style="width:${pct(t)}%"></u></span><small>${pct(t)} % complété</small></span></button>`).join('')}</div>
<p style="margin-top:18px;text-align:center;font-size:13px">Tes notes, photos et vocaux restent sur ton appareil.</p>`}
function theme(){const t=T.find(x=>x.id===cur),N=S.notes.filter(x=>x.t===cur),P=S.photos.filter(x=>x.t===cur),V=S.voices.filter(x=>x.t===cur),d=S.done[cur]||[];let b='';
if(tab==='no')b=`<div class=page><div class=pgh><span>${t.n}</span><span>${fd(Date.now())}</span></div><textarea id=nt placeholder="Écris une phrase, un mot nouveau, une question…"></textarea></div><button class=btn data-a=addn>Ajouter la note (+10 XP)</button>`+(N.length?'':'<p style="margin-top:14px">Aucune note. Écris ta première phrase !</p>')+N.map(n=>`<div class="card sheet"><button class=x data-a=deln data-id=${n.id} aria-label=Supprimer>✕</button><span>${E(n.x).replace(/\n/g,'<br>')}</span><br><span style="font-size:12px;color:var(--mu)">${fd(n.id)}</span></div>`).join('');
if(tab==='ph')b=`<input id=cap placeholder="Légende (ex : mon titre de transport)" maxlength=60><label class=btn style="position:relative;overflow:hidden;text-align:center;cursor:pointer">📷 Prendre ou choisir une photo<input id=fi type=file accept="image/*" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer"></label>`+(P.length?'':'<p style="margin-top:14px">Aucune photo. Photographie un panneau, un ticket, un document…</p>')+`<div class=pg>${P.map(p=>`<div><img src="${p.s}" data-a=vp data-id=${p.id} alt="${E(p.c)}"><span>${E(p.c)}</span></div>`).join('')}</div>`;
if(tab==='vo')b=`<p>Ouvre le dictaphone de ton téléphone, enregistre-toi, puis valide (+15 XP).</p><input id=sel placeholder="Titre (ex : je me présente)" maxlength=60><label class=btn style="position:relative;overflow:hidden;text-align:center;cursor:pointer">🎤 Ouvrir le dictaphone<input id=ai type=file accept="audio/*" capture style="position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer"></label><label class=btn style="position:relative;overflow:hidden;text-align:center;cursor:pointer;background:#1cb0f6;box-shadow:0 4px 0 #1688c4">📁 Choisir un enregistrement<input id=ai2 type=file accept="audio/*" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer"></label>`+(V.length?'':'<p style="margin-top:14px">Aucun vocal. Dis la phrase à voix haute !</p>')+V.map(v=>`<div class=card><button class=x data-a=delv data-id=${v.id} aria-label=Supprimer>✕</button><b style="font-size:14px">${E(v.l)}</b><br><span style="font-size:12px;color:var(--mu)">${fd(v.id)}</span><audio controls src="${v.s}"></audio></div>`).join('');
return `<button class=sm data-a=back>← Retour</button><div class=ban style="background:linear-gradient(135deg,${t.c},${t.c}bb)"><span class=em>${t.e}</span><b>${t.n}</b><span class=bar style="background:rgba(255,255,255,.35)"><u style="width:${pct(t)}%;background:#fff"></u></span></div>
<div class=tabs>${[['no','📝','Notes'],['ph','📷','Photos'],['vo','🎤','Vocaux']].map(a=>`<button class="tab ${tab===a[0]?'on':''}" data-a=tab data-t=${a[0]}>${a[1]}<br>${a[2]}</button>`).join('')}</div><div style="margin-top:12px">${b}</div>
${view?`<div class=ov data-a=close><img src="${view.s}" alt=""><b style="color:#fff">${E(view.c)}</b><button class="btn red" data-a=delp data-id=${view.id}>Supprimer</button><button class=btn data-a=close>Fermer</button></div>`:''}`}
function render(){$('#app').innerHTML=cur?theme():home();if(!cur)window.scrollTo(0,0)}
async function toggleRec(){
if(rec){rec.stop();return}
const l=$('#sel').value;
try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[],r=new MediaRecorder(st);
r.ondataavailable=e=>ch.push(e.data);
r.onstop=async()=>{st.getTracks().forEach(x=>x.stop());rec=null;const s=await rd(new Blob(ch,{type:r.mimeType}));S.voices.unshift({id:Date.now(),t:cur,l,s});gain(15);render()};
r.start();rec=r;render()}catch(e){rec=null;toast('Micro indisponible. Autorise le micro dans ton navigateur.')}}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=+el.dataset.id;
if(a==='close'&&e.target.closest('button,img')&&e.target.tagName==='IMG')return;
if(a==='open'){cur=el.dataset.id;tab='no'}
else if(a==='back')cur=null;
else if(a==='tab')tab=el.dataset.t;
else if(a==='name'){const v=$('#nm').value.trim();if(v){S.name=v;sv()}}
else if(a==='copy'){try{await navigator.clipboard.writeText(location.href);toast('Lien copié ! Colle-le dans Chrome ou Safari.')}catch(x){toast('Copie impossible : utilise le menu ⋮ du navigateur')}return}
else if(a==='share'){const u=location.href;try{if(navigator.share)await navigator.share({title:'Portfolio FLE',text:'Mon cahier pour apprendre le français',url:u});else{await navigator.clipboard.writeText(u);toast('Lien copié !')}}catch(x){}return}
else if(a==='tg'){const i=+el.dataset.i,d=S.done[cur]=S.done[cur]||[];if(d.includes(i))S.done[cur]=d.filter(x=>x!==i);else{d.push(i);gain(5)}sv()}
else if(a==='addn'){const v=$('#nt').value.trim();if(!v)return toast('Écris quelque chose d’abord');S.notes.unshift({id:Date.now(),t:cur,x:v});gain(10)}
else if(a==='deln'){S.notes=S.notes.filter(n=>n.id!==id);sv()}
else if(a==='vp')view=S.photos.find(p=>p.id===id);
else if(a==='close')view=null;
else if(a==='delp'){S.photos=S.photos.filter(p=>p.id!==id);view=null;sv()}
else if(a==='delv'){S.voices=S.voices.filter(v=>v.id!==id);sv()}
else if(a==='rec'){toggleRec();return}
render()});
document.addEventListener('change',async e=>{if((e.target.id==='ai'||e.target.id==='ai2')&&e.target.files[0]){const f=e.target.files[0],l=($('#sel').value||'').trim()||'Vocal';S.voices.unshift({id:Date.now(),t:cur,l,s:await rd(f)});gain(15);render();return}if(e.target.id!=='fi'||!e.target.files[0])return;const c=$('#cap').value.trim()||'Photo',src=await rd(e.target.files[0]),im=new Image();
im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);S.photos.unshift({id:Date.now(),t:cur,c,s:cv.toDataURL('image/jpeg',.75)});gain(10);render()};im.src=src});
(async()=>{await op();await ld();render()})();
</script></body></html>
